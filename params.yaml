extinguish:
  detection_mag_limit: 28.0
  redshift_min: 0.003
  redshift_max: 1.0
  n_redshift: 50

# Grilla con la que se generan los kn_windows_*.parquet. 100 bines x 10000 realizaciones = 1e6.
#
# n_redshift son BINES, no nodos: desde 2026-09-16 `sample_kn_realizations_in_bins` sortea el
# redshift DENTRO del bin en vez de pegarlo al nodo. Con el z en el nodo, el millon de KN ocupaba
# exactamente 100 valores de redshift contra los 630 583 de los contaminantes, y "z esta en la
# grilla KN" clasificaba al 99.998% sin mirar una curva. No cuesta computo: la fotometria ya se
# integraba por realizacion, no por nodo.
#
# Con el factor angular aplicado hay detecciones en TODO el rango, incluido z=1 (7.0% deep, 0.9%
# wide), asi que la grilla se satura por arriba: para medir el z5% de deep hay que subir
# redshift_max. El techo real de diversidad no es este numero
# sino las 900 simulaciones LANL x 54 angulos = 48600 SEDs distintas, asi que cada SED se repite
# ~20 veces.
kilonova_windows:
  redshift_min: 0.02
  redshift_max: 1.0
  n_redshift: 100
  redshift_spacing: log
  realizations_per_redshift: 10000

# El izc rellena el deficit de contaminantes de bajo redshift contra el histograma de las KN.
#
# 0.9 llena el 90% de CADA bin: el faltante se reparte por igual sobre todo el rango, no se
# concentra arriba. Medido sobre la corrida vigente, la razon (contaminantes OU + izc) / KN queda
# en 0.80-1.10 en deep y 0.89-2.33 en wide. Alcanza de sobra para lo que la muestra existe: el
# atajo era 29 contaminantes contra 239 369 KN en el primer bin, y un deficit residual del 12% no
# es explotable como lo era uno de factor 8000.
#
# LO QUE ESTE NUMERO NO CONTROLA es la reutilizacion de padres. Esa viene del muestreo CON
# REEMPLAZO de draw_population_from_parents, no de que falten padres: medido, SN Ib y SN Ic dan
# 1.59 copias por padre a escala 0.9 y darian 1.67 a 1.0, aun cuando piden aproximadamente tantos
# objetos como padres hay. Bajar la escala casi no la mueve. Lo que la contiene es el split por
# `parent_key`, que mantiene a un padre y a todas sus copias del mismo lado.
#
# brightness_source: de donde sale el brillo de cada padre.
#   window -- de su propia ventana en early_windows_{tier}.parquet, anclada a la plantilla por
#             `window_anchor`. No abre el hdf5: la muestra se genera con lo que ya esta en el repo.
#             Solo puede usar padres QUE EL SURVEY DETECTO, asi que a cada z faltan los mas
#             debiles; se asume, porque 48 modelos se reparten 1.3 millones de objetos y la parte
#             debil de una plantilla llega igual por los objetos detectados mas abajo.
#   hdf5   -- del pico de la curva de luz completa, en los 16 GB por campo del release. Es contra
#             lo que se calibro el otro camino: sobre 1320 objetos los dos coinciden en 0.002 mag.
izc_windows:
  deficit_scale: 0.9
  brightness_source: window
